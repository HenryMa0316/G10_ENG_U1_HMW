<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Not Growing Up — Pixel Prototype v2</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a0a;
    height: 100%;
    overflow: hidden;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #hud {
    position: fixed;
    top: 12px;
    left: 14px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    color: #f0e8d8;
    text-shadow: 2px 2px 0 #000;
    pointer-events: none;
    z-index: 10;
  }
  #hint {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: #888;
    text-shadow: 1px 1px 0 #000;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">Age: 14 &nbsp; $0</div>
<div id="hint">WASD / arrows to move</div>

<script>
/* =========================================================
   Not Growing Up — pixel prototype v2
   Stardew-style proportions, 16x24 player, 4-dir walk
   ========================================================= */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// internal resolution — bigger view, still pixel-crisp
const VIEW_W = 480;
const VIEW_H = 270;
const SCALE = 3;

canvas.width = VIEW_W * SCALE;
canvas.height = VIEW_H * SCALE;
canvas.style.width = VIEW_W * SCALE + 'px';
canvas.style.height = VIEW_H * SCALE + 'px';
ctx.imageSmoothingEnabled = false;

// ---- world ----
const TILE = 16;
const WORLD_COLS = 100;
const WORLD_ROWS = 80;
const WORLD_W = WORLD_COLS * TILE;
const WORLD_H = WORLD_ROWS * TILE;

const T_GRASS = 0;
const T_ROAD = 1;
const T_PATH = 2;
const T_WALL = 3;
const T_DOOR = 4;
const T_TREE = 5;
const T_WATER = 6;

const world = [];
for (let y = 0; y < WORLD_ROWS; y++)
  world.push(new Array(WORLD_COLS).fill(T_GRASS));

// grass variant map (for texture)
const grassVar = [];
for (let y = 0; y < WORLD_ROWS; y++) {
  const row = [];
  for (let x = 0; x < WORLD_COLS; x++) row.push(Math.floor(Math.random() * 4));
  grassVar.push(row);
}

function rect(x, y, w, h, t) {
  for (let j = y; j < y + h; j++)
    for (let i = x; i < x + w; i++)
      if (j >= 0 && j < WORLD_ROWS && i >= 0 && i < WORLD_COLS)
        world[j][i] = t;
}

// ---- roads ----
rect(0, 18, WORLD_COLS, 4, T_ROAD);
rect(48, 0, 4, WORLD_ROWS, T_ROAD);
rect(0, 44, WORLD_COLS, 3, T_ROAD);
rect(24, 0, 3, WORLD_ROWS, T_ROAD);
rect(72, 0, 3, WORLD_ROWS, T_ROAD);

// ---- buildings ----
const buildings = [
  // immigrant home (upper-left)
  { x: 8,  y: 6,  w: 10, h: 7, name: 'HOME',    doorX: 12, doorY: 12, roof: '#8a3a2a', wall: '#d8b888', trim: '#6a2a1a' },
  // cram school
  { x: 24, y: 6,  w: 9, h: 6, name: 'CRAM',    doorX: 28, doorY: 11, roof: '#3a4a7a', wall: '#d8d8c8', trim: '#2a3a5a' },
  // supermarket
  { x: 36, y: 6,  w: 10, h: 7, name: 'MARKET',  doorX: 40, doorY: 12, roof: '#4a7a3a', wall: '#e8e8d8', trim: '#2a5a2a' },
  // school (main street)
  { x: 56, y: 4,  w: 14, h: 10, name: 'SCHOOL', doorX: 62, doorY: 13, roof: '#6a3a2a', wall: '#f0e0c0', trim: '#4a2a1a' },
  // company (main street lower)
  { x: 56, y: 50, w: 14, h: 10, name: 'COMPANY',doorX: 62, doorY: 59, roof: '#2a3a4a', wall: '#c8d0d8', trim: '#1a2a3a' },
  // police
  { x: 84, y: 6,  w: 10, h: 7, name: 'POLICE',  doorX: 88, doorY: 12, roof: '#2a2a5a', wall: '#c8c8d8', trim: '#1a1a4a' },
  // foster home (lower-right)
  { x: 84, y: 60, w: 10, h: 7, name: 'FOSTER',  doorX: 88, doorY: 66, roof: '#7a4a2a', wall: '#d8c8a8', trim: '#5a2a1a' },
  // big house (upper-right, local-born)
  { x: 84, y: 26, w: 12, h: 9, name: 'HOUSE',   doorX: 89, doorY: 34, roof: '#5a2a2a', wall: '#f8f0e0', trim: '#3a1a1a' },
  // extra houses
  { x: 8,  y: 30, w: 8, h: 6, name: '',         doorX: 11, doorY: 35, roof: '#7a5a3a', wall: '#e0d0b0', trim: '#5a3a1a' },
  { x: 20, y: 30, w: 8, h: 6, name: '',         doorX: 23, doorY: 35, roof: '#6a4a3a', wall: '#d8c8a8', trim: '#4a2a1a' },
  { x: 84, y: 44, w: 9, h: 7, name: '',         doorX: 88, doorY: 50, roof: '#5a3a2a', wall: '#e8d8c0', trim: '#3a1a0a' },
];

buildings.forEach(b => {
  rect(b.x, b.y, b.w, b.h, T_WALL);
  world[b.doorY][b.doorX] = T_DOOR;
});

// ---- trees ----
function placeTree(cx, cy) {
  if (world[cy][cx] === T_GRASS) world[cy][cx] = T_TREE;
}
for (let i = 0; i < 200; i++) {
  const x = Math.floor(Math.random() * WORLD_COLS);
  const y = Math.floor(Math.random() * WORLD_ROWS);
  placeTree(x, y);
}

// park
rect(84, 36, 14, 6, T_GRASS);
for (let i = 0; i < 12; i++) {
  placeTree(85 + Math.floor(Math.random() * 12), 37 + Math.floor(Math.random() * 4));
}

// water
rect(6, 64, 18, 10, T_WATER);

/* =========================================================
   Player sprite — 16x24, 4 directions, 4 frames each
   We generate the sprite as an offscreen canvas once.
   ========================================================= */

const SPRITE_W = 16;
const SPRITE_H = 24;

function makeSpriteSheet(skin, hair, shirt, pants, shoes) {
  // 4 rows (down, up, left, right) x 4 cols (walk frames)
  const sheet = document.createElement('canvas');
  sheet.width = SPRITE_W * 4;
  sheet.height = SPRITE_H * 4;
  const s = sheet.getContext('2d');
  s.imageSmoothingEnabled = false;

  const dirs = ['down', 'up', 'left', 'right'];

  for (let d = 0; d < 4; d++) {
    for (let f = 0; f < 4; f++) {
      drawCharFrame(s, f * SPRITE_W, d * SPRITE_H, dirs[d], f, skin, hair, shirt, pants, shoes);
    }
  }
  return sheet;
}

function drawCharFrame(c, ox, oy, dir, frame, skin, hair, shirt, pants, shoes) {
  // helper: 1 pixel
  function p(x, y, col) {
    c.fillStyle = col;
    c.fillRect(ox + x, oy + y, 1, 1);
  }
  function r(x, y, w, h, col) {
    c.fillStyle = col;
    c.fillRect(ox + x, oy + y, w, h);
  }

  // shadow under feet
  r(3, 22, 10, 1, 'rgba(0,0,0,0.25)');

  // walk offset
  const legA = (frame === 1) ? 1 : (frame === 3 ? -1 : 0);
  const legB = -legA;
  const armA = (frame === 1) ? 1 : (frame === 3 ? -1 : 0);

  // legs / pants
  r(4, 17, 3, 4, pants);
  r(9, 17, 3, 4, pants);

  // shoes
  r(4, 21 + legA, 3, 2, shoes);
  r(9, 21 + legB, 3, 2, shoes);

  // body / shirt
  r(4, 10, 8, 7, shirt);
  // shirt shading
  r(4, 10, 8, 1, 'rgba(255,255,255,0.15)');
  r(4, 16, 8, 1, 'rgba(0,0,0,0.2)');
  // shirt center line
  r(7, 12, 2, 4, 'rgba(0,0,0,0.15)');

  // arms
  if (dir === 'down' || dir === 'up') {
    r(2, 11 + armA, 2, 5, shirt);
    r(12, 11 - armA, 2, 5, shirt);
    // hands
    r(2, 16 + armA, 2, 2, skin);
    r(12, 16 - armA, 2, 2, skin);
  } else {
    r(3, 11, 2, 5, shirt);
    r(11, 11, 2, 5, shirt);
    r(3, 16, 2, 2, skin);
    r(11, 16, 2, 2, skin);
  }

  // head
  r(4, 2, 8, 8, skin);
  // head shading
  r(4, 2, 8, 1, 'rgba(255,255,255,0.2)');
  r(4, 9, 8, 1, 'rgba(0,0,0,0.15)');

  // hair depending on direction
  if (dir === 'down') {
    r(4, 1, 8, 3, hair);
    r(3, 2, 1, 4, hair);
    r(12, 2, 1, 4, hair);
    r(4, 4, 1, 1, hair);
    r(11, 4, 1, 1, hair);
    // eyes
    p(6, 6, '#1a1a2a');
    p(9, 6, '#1a1a2a');
    // mouth
    p(7, 8, 'rgba(0,0,0,0.3)');
  } else if (dir === 'up') {
    r(4, 1, 8, 5, hair);
    r(3, 2, 1, 5, hair);
    r(12, 2, 1, 5, hair);
  } else if (dir === 'left') {
    r(4, 1, 8, 3, hair);
    r(3, 2, 1, 5, hair);
    r(12, 2, 1, 3, hair);
    // one eye
    p(5, 6, '#1a1a2a');
    // side of face shadow
    r(9, 5, 3, 3, 'rgba(0,0,0,0.1)');
  } else {
    r(4, 1, 8, 3, hair);
    r(12, 2, 1, 5, hair);
    r(3, 2, 1, 3, hair);
    p(10, 6, '#1a1a2a');
    r(4, 5, 3, 3, 'rgba(0,0,0,0.1)');
  }
}

// three skins for the three lines
const SKINS = {
  immigrant: { skin: '#e8c090', hair: '#1a1010', shirt: '#4a6a9a', pants: '#2a2a3a', shoes: '#3a2a1a' },
  indigenous: { skin: '#a87858', hair: '#1a0a0a', shirt: '#7a5a3a', pants: '#3a3a2a', shoes: '#2a1a0a' },
  white: { skin: '#f0d8b8', hair: '#6a4a2a', shirt: '#8a8a7a', pants: '#3a3a4a', shoes: '#2a2a2a' },
};

let sprites = {};
for (const key in SKINS) {
  const s = SKINS[key];
  sprites[key] = makeSpriteSheet(s.skin, s.hair, s.shirt, s.pants, s.shoes);
}

/* =========================================================
   Player
   ========================================================= */

const player = {
  x: 14 * TILE,
  y: 20 * TILE,
  speed: 55,          // pixels per second — stardew-ish
  dir: 0,             // 0 down, 1 up, 2 left, 3 right
  frame: 0,
  frameTimer: 0,
  moving: false,
  line: 'immigrant',
};

/* =========================================================
   Camera
   ========================================================= */

const camera = { x: 0, y: 0 };

function updateCamera() {
  camera.x = Math.floor(player.x - VIEW_W / 2);
  camera.y = Math.floor(player.y - VIEW_H / 2);
  if (camera.x < 0) camera.x = 0;
  if (camera.y < 0) camera.y = 0;
  if (camera.x > WORLD_W - VIEW_W) camera.x = WORLD_W - VIEW_W;
  if (camera.y > WORLD_H - VIEW_H) camera.y = WORLD_H - VIEW_H;
}

/* =========================================================
   Movement
   ========================================================= */

const keys = {};
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
});
document.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

function tileAt(wx, wy) {
  const tx = Math.floor(wx / TILE);
  const ty = Math.floor(wy / TILE);
  if (tx < 0 || ty < 0 || tx >= WORLD_COLS || ty >= WORLD_ROWS) return T_WALL;
  return world[ty][tx];
}

function canWalk(wx, wy) {
  const boxW = 8;
  const boxH = 4;
  const left = wx - boxW / 2;
  const right = wx + boxW / 2;
  const top = wy - boxH;
  const bottom = wy;
  const pts = [[left, top], [right, top], [left, bottom], [right, bottom]];
  for (const [px, py] of pts) {
    const t = tileAt(px, py);
    if (t === T_WALL || t === T_TREE || t === T_WATER) return false;
  }
  return true;
}

function updatePlayer(dt) {
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;

  player.moving = (dx !== 0 || dy !== 0);

  if (player.moving) {
    if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }

    // direction
    if (Math.abs(dx) > Math.abs(dy)) {
      player.dir = dx > 0 ? 3 : 2;
    } else if (dy !== 0) {
      player.dir = dy > 0 ? 0 : 1;
    }

    const step = player.speed * dt;
    const nx = player.x + dx * step;
    const ny = player.y + dy * step;

    if (canWalk(nx, player.y)) player.x = nx;
    if (canWalk(player.x, ny)) player.y = ny;

    player.frameTimer += dt;
    if (player.frameTimer > 0.13) {
      player.frameTimer = 0;
      player.frame = (player.frame + 1) % 4;
    }
  } else {
    player.frame = 0;
    player.frameTimer = 0;
  }
}

/* =========================================================
   Tile drawing
   ========================================================= */

function drawTile(t, sx, sy, wx, wy) {
  if (t === T_GRASS) {
    const v = grassVar[wy] ? grassVar[wy][wx] : 0;
    const base = ['#5a8a4a', '#568646', '#5e8e4e', '#528242'][v];
    ctx.fillStyle = base;
    ctx.fillRect(sx, sy, TILE, TILE);
    // tiny grass tufts
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(sx + 3 + v, sy + 4, 2, 2);
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.fillRect(sx + 10 - v, sy + 11, 2, 2);
  } else if (t === T_ROAD) {
    ctx.fillStyle = '#5a5a5a';
    ctx.fillRect(sx, sy, TILE, TILE);
    ctx.fillStyle = '#666';
    ctx.fillRect(sx + 2, sy + 2, 6, 6);
    ctx.fillStyle = '#505050';
    ctx.fillRect(sx + 10, sy + 10, 4, 4);
    // yellow line
    if (wy % 8 === 0) {
      ctx.fillStyle = '#c8b040';
      ctx.fillRect(sx + 6, sy, 4, TILE);
    }
  } else if (t === T_PATH) {
    ctx.fillStyle = '#a89878';
    ctx.fillRect(sx, sy, TILE, TILE);
    ctx.fillStyle = '#988868';
    ctx.fillRect(sx + 4, sy + 4, 2, 2);
    ctx.fillRect(sx + 11, sy + 9, 2, 2);
  } else if (t === T_WALL) {
    ctx.fillStyle = '#c8a878';
    ctx.fillRect(sx, sy, TILE, TILE);
  } else if (t === T_DOOR) {
    ctx.fillStyle = '#4a2a1a';
    ctx.fillRect(sx, sy, TILE, TILE);
  } else if (t === T_TREE) {
    // grass under tree
    ctx.fillStyle = '#4a7a3a';
    ctx.fillRect(sx, sy, TILE, TILE);
    // trunk
    ctx.fillStyle = '#3a2010';
    ctx.fillRect(sx + 6, sy + 11, 4, 5);
    // canopy shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(sx + 2, sy + 12, 12, 3);
    // canopy
    ctx.fillStyle = '#2a5a2a';
    ctx.fillRect(sx + 1, sy + 1, 14, 11);
    ctx.fillStyle = '#3a7a3a';
    ctx.fillRect(sx + 2, sy + 2, 12, 9);
    ctx.fillStyle = '#4a8a4a';
    ctx.fillRect(sx + 3, sy + 3, 8, 6);
    // highlight
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(sx + 4, sy + 3, 4, 3);
  } else if (t === T_WATER) {
    ctx.fillStyle = '#2a4a7a';
    ctx.fillRect(sx, sy, TILE, TILE);
    ctx.fillStyle = '#3a6a9a';
    ctx.fillRect(sx + 2, sy + 5, 12, 2);
    ctx.fillStyle = '#4a7aaa';
    ctx.fillRect(sx + 4, sy + 10, 8, 2);
  }
}

/* =========================================================
   Building drawing
   ========================================================= */

function drawBuilding(b) {
  const x = b.x * TILE - camera.x;
  const y = b.y * TILE - camera.y;
  const w = b.w * TILE;
  const h = b.h * TILE;

  if (x + w < 0 || x > VIEW_W || y + h < 0 || y > VIEW_H) return;

  const roofH = Math.floor(h * 0.4);

  // wall
  ctx.fillStyle = b.wall;
  ctx.fillRect(x, y + roofH, w, h - roofH);

  // wall brick lines
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  for (let by = y + roofH + 4; by < y + h; by += 6) {
    ctx.fillRect(x, by, w, 1);
  }

  // roof
  ctx.fillStyle = b.roof;
  ctx.fillRect(x - 2, y, w + 4, roofH);

  // roof shading
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(x - 2, y + roofH - 3, w + 4, 3);

  // roof tiles
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  for (let rx = x - 2; rx < x + w + 2; rx += 6) {
    ctx.fillRect(rx, y + 2, 3, roofH - 6);
  }

  // roof trim
  ctx.fillStyle = b.trim;
  ctx.fillRect(x - 2, y + roofH - 1, w + 4, 2);

  // windows
  const winSize = 8;
  const gap = 4;
  const winY = y + roofH + 6;
  let wx = x + gap + 2;
  while (wx + winSize < x + w - gap) {
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(wx - 1, winY - 1, winSize + 2, winSize + 2);
    ctx.fillStyle = '#8ac8e8';
    ctx.fillRect(wx, winY, winSize, winSize);
    ctx.fillStyle = '#b8e8f8';
    ctx.fillRect(wx + 1, winY + 1, 3, 3);
    ctx.fillStyle = '#6aa8c8';
    ctx.fillRect(wx, winY + winSize - 2, winSize, 2);
    wx += winSize + gap + 4;
  }

  // door
  const dx = b.doorX * TILE - camera.x;
  const dy = b.doorY * TILE - camera.y;
  ctx.fillStyle = '#2a1a0a';
  ctx.fillRect(dx - 1, dy - 2, TILE + 2, TILE + 2);
  ctx.fillStyle = b.trim;
  ctx.fillRect(dx, dy - 1, TILE, TILE + 1);
  ctx.fillStyle = '#5a3a1a';
  ctx.fillRect(dx + 2, dy + 1, TILE - 4, TILE - 1);
  // door knob
  ctx.fillStyle = '#f0d060';
  ctx.fillRect(dx + 11, dy + 8, 2, 2);

  // door step
  ctx.fillStyle = '#888';
  ctx.fillRect(dx - 1, dy + TILE, TILE + 2, 2);

  // name
  if (b.name) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 8px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(b.name, x + w / 2, y - 4);
    ctx.textAlign = 'left';
  }
}

/* =========================================================
   Render
   ========================================================= */

function render() {
  ctx.fillStyle = '#1a2a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.scale(SCALE, SCALE);

  const startCol = Math.max(0, Math.floor(camera.x / TILE) - 1);
  const startRow = Math.max(0, Math.floor(camera.y / TILE) - 1);
  const endCol = Math.min(WORLD_COLS, startCol + Math.ceil(VIEW_W / TILE) + 3);
  const endRow = Math.min(WORLD_ROWS, startRow + Math.ceil(VIEW_H / TILE) + 3);

  for (let y = startRow; y < endRow; y++) {
    for (let x = startCol; x < endCol; x++) {
      const t = world[y][x];
      const sx = x * TILE - camera.x;
      const sy = y * TILE - camera.y;
      drawTile(t, sx, sy, x, y);
    }
  }

  // sort buildings by y so lower ones draw on top
  const visible = buildings.filter(b => {
    const bx = b.x * TILE - camera.x;
    const by = b.y * TILE - camera.y;
    return bx + b.w * TILE > 0 && bx < VIEW_W && by + b.h * TILE > 0 && by < VIEW_H;
  });
  visible.sort((a, b) => (a.y + a.h) - (b.y + b.h));
  visible.forEach(drawBuilding);

  // player
  const sprite = sprites[player.line];
  const sx = Math.floor(player.x - camera.x) - SPRITE_W / 2;
  const sy = Math.floor(player.y - camera.y) - SPRITE_H + 4;
  ctx.drawImage(
    sprite,
    player.frame * SPRITE_W, player.dir * SPRITE_H, SPRITE_W, SPRITE_H,
    sx, sy, SPRITE_W, SPRITE_H
  );

  ctx.restore();
}

/* =========================================================
   Loop
   ========================================================= */

let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  updatePlayer(dt);
  updateCamera();
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
</body>
</html>
