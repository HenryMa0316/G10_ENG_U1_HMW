<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Not Growing Up</title>
<style>
  body {
    margin: 0;
    background: #14110f;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    color: #e8e0d0;
    overflow: hidden;
  }
  #wrap { position: relative; }
  canvas {
    display: block;
    image-rendering: pixelated;
    background: #2b2620;
  }
  #hud {
    position: absolute;
    top: 10px; left: 12px;
    font-size: 14px;
    color: #d8c8a8;
    pointer-events: none;
    text-shadow: 1px 1px 0 #000;
  }
  #hudRight {
    position: absolute;
    top: 10px; right: 12px;
    font-size: 14px;
    color: #d8c8a8;
    text-align: right;
    pointer-events: none;
    text-shadow: 1px 1px 0 #000;
  }
  #dialog {
    position: absolute;
    bottom: 16px; left: 16px; right: 16px;
    background: #0e0c0a;
    border: 2px solid #5a4a3a;
    padding: 14px 18px;
    font-size: 15px;
    line-height: 1.6;
    display: none;
    color: #e8e0d0;
  }
  #dialog .name {
    color: #d8a860;
    margin-bottom: 6px;
    font-size: 13px;
    letter-spacing: 1px;
  }
  #dialog .choices { margin-top: 10px; }
  #dialog .choice {
    display: block;
    background: none;
    border: none;
    border-left: 2px solid #5a4a3a;
    color: #e8e0d0;
    font-family: inherit;
    font-size: 14px;
    text-align: left;
    padding: 6px 12px;
    margin-bottom: 6px;
    cursor: pointer;
    width: 100%;
  }
  #dialog .choice:hover {
    border-left-color: #d8a860;
    background: #1a1610;
  }
  #hint {
    position: absolute;
    bottom: 2px; left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: #6a5a4a;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="640" height="480"></canvas>
  <div id="hud">Age: 14</div>
  <div id="hudRight">$0</div>
  <div id="hint">WASD move · SPACE talk / enter · walk home to sleep</div>
  <div id="dialog">
    <div class="name" id="dName"></div>
    <div id="dText"></div>
    <div class="choices" id="dChoices"></div>
  </div>
</div>

<script>
/* =========================================================
   Not Growing Up — immigrant line prototype
   ========================================================= */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const TILE = 16;
const COLS = canvas.width / TILE;
const ROWS = canvas.height / TILE;

const state = {
  scene: 'outside',      // 'outside' | 'home' | 'school' | 'company'
  x: 6, y: 6,
  age: 14,
  money: 0,
  dialogOpen: false,
  flags: {
    droppedOut: false,
    hasJob: false,
    leftHome: false,
    skippedStudy: false,
  },
  talkedTo: {},
  ending: false,
};

/* ---------- outside map ---------- */
const city = [];
for (let y = 0; y < ROWS; y++) city.push(new Array(COLS).fill(0));

function rect(x, y, w, h, v) {
  for (let j = y; j < y + h; j++)
    for (let i = x; i < x + w; i++)
      if (j >= 0 && j < ROWS && i >= 0 && i < COLS) city[j][i] = v;
}

/* buildings */
// home (upper-left, immigrant)
rect(3, 3, 6, 4, 1);
// cram school + supermarket (upper-left area)
rect(12, 3, 5, 4, 1);   // cram
rect(19, 3, 5, 4, 1);   // supermarket
// school (main street, center-top)
rect(26, 3, 7, 4, 1);
// company (main street, center-bottom)
rect(26, 20, 8, 5, 1);
// police (upper-right)
rect(35, 3, 4, 4, 1);
// park (upper-right)
rect(35, 9, 4, 4, 3);

/* doors */
city[7][6] = 2;    // home
city[7][14] = 2;   // cram
city[7][21] = 2;   // supermarket
city[7][29] = 2;   // school
city[25][30] = 2;  // company
city[7][37] = 2;   // police

/* main street (just visual, walkable) */
rect(0, 12, COLS, 3, 0);

/* ---------- indoor maps ---------- */
const indoors = {
  home: {
    w: 20, h: 12,
    map: null,
    npcs: [
      { id: 'mom', x: 4, y: 4, name: 'Mom', color: '#c86464' },
      { id: 'dad', x: 15, y: 4, name: 'Dad', color: '#a85050' },
    ],
    exit: { x: 10, y: 11 },
  },
  school: {
    w: 20, h: 12,
    npcs: [
      { id: 'teacher', x: 10, y: 3, name: 'Teacher', color: '#6494c8' },
      { id: 'classmate', x: 5, y: 6, name: 'Classmate', color: '#88b060' },
    ],
    exit: { x: 10, y: 11 },
  },
  company: {
    w: 20, h: 12,
    npcs: [
      { id: 'hr', x: 6, y: 4, name: 'HR', color: '#a070c0' },
      { id: 'boss', x: 14, y: 4, name: 'Boss', color: '#c0a060' },
    ],
    exit: { x: 10, y: 11 },
  },
};

function buildIndoor(name) {
  const r = indoors[name];
  if (r.map) return r.map;
  const m = [];
  for (let y = 0; y < r.h; y++) m.push(new Array(r.w).fill(1));
  for (let y = 1; y < r.h - 1; y++)
    for (let x = 1; x < r.w - 1; x++) m[y][x] = 0;
  m[r.exit.y][r.exit.x] = 2;
  r.map = m;
  return m;
}

/* ---------- npcs outside ---------- */
const outsideNPCs = [
  { id: 'neighbor', x: 10, y: 10, name: 'Neighbor', color: '#888' },
  { id: 'friend', x: 33, y: 12, name: 'Friend', color: '#88b060' },
  { id: 'stranger', x: 20, y: 15, name: 'Stranger', color: '#777' },
];

/* ---------- drawing ---------- */
function drawOutside() {
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const t = city[y][x];
      let c = '#3a3228';
      if (t === 1) c = '#5a4a3a';
      if (t === 2) c = '#c8a050';
      if (t === 3) c = '#4a6a3a';
      ctx.fillStyle = c;
      ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
    }
  }
  ctx.fillStyle = '#d8c8a8';
  ctx.font = '8px monospace';
  ctx.fillText('HOME', 3 * TILE + 2, 3 * TILE - 2);
  ctx.fillText('CRAM', 12 * TILE + 2, 3 * TILE - 2);
  ctx.fillText('MARKET', 19 * TILE + 2, 3 * TILE - 2);
  ctx.fillText('SCHOOL', 26 * TILE + 2, 3 * TILE - 2);
  ctx.fillText('POLICE', 35 * TILE + 2, 3 * TILE - 2);
  ctx.fillText('PARK', 35 * TILE + 2, 9 * TILE - 2);
  ctx.fillText('COMPANY', 26 * TILE + 2, 20 * TILE - 2);
  ctx.fillStyle = '#5a4a3a';
  ctx.fillText('MAIN ST', 2 * TILE, 12 * TILE - 2);

  outsideNPCs.forEach(n => {
    if (n.id === 'friend' && state.age > 22) return;
    ctx.fillStyle = n.color;
    ctx.fillRect(n.x * TILE + 4, n.y * TILE + 4, 8, 8);
    ctx.fillStyle = '#fff';
    ctx.font = '7px monospace';
    ctx.fillText(n.name, n.x * TILE - 6, n.y * TILE - 3);
  });
}

function drawIndoor() {
  const r = indoors[state.scene];
  const m = buildIndoor(state.scene);
  const w = r.w * TILE, h = r.h * TILE;
  const ox = (canvas.width - w) / 2;
  const oy = (canvas.height - h) / 2;

  ctx.fillStyle = '#0e0c0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let y = 0; y < r.h; y++) {
    for (let x = 0; x < r.w; x++) {
      const t = m[y][x];
      let c = '#4a4038';
      if (t === 1) c = '#6a5a4a';
      if (t === 2) c = '#c8a050';
      ctx.fillStyle = c;
      ctx.fillRect(ox + x * TILE, oy + y * TILE, TILE, TILE);
    }
  }

  // draw indoor NPCs
  r.npcs.forEach(n => {
    if (state.scene === 'school' && state.flags.droppedOut) return;
    if (state.scene === 'home' && state.flags.leftHome) return;
    ctx.fillStyle = n.color;
    ctx.fillRect(ox + n.x * TILE + 4, oy + n.y * TILE + 4, 8, 8);
    ctx.fillStyle = '#fff';
    ctx.font = '7px monospace';
    ctx.fillText(n.name, ox + n.x * TILE - 6, oy + n.y * TILE - 3);
  });

  // player
  ctx.fillStyle = '#f0c674';
  ctx.fillRect(ox + state.x * TILE + 4, oy + state.y * TILE + 4, 8, 8);

  // hint
  ctx.fillStyle = '#6a5a4a';
  ctx.font = '9px monospace';
  ctx.fillText('Walk to the yellow tile to leave.', ox + 4, oy - 6);
}

function draw() {
  if (state.scene === 'outside') {
    drawOutside();
    ctx.fillStyle = '#f0c674';
    ctx.fillRect(state.x * TILE + 4, state.y * TILE + 4, 8, 8);
  } else {
    drawIndoor();
  }
}

/* ---------- movement ---------- */
function canWalk(x, y) {
  if (state.scene === 'outside') {
    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return false;
    return city[y][x] !== 1;
  } else {
    const r = indoors[state.scene];
    if (x < 0 || x >= r.w || y < 0 || y >= r.h) return false;
    const m = buildIndoor(state.scene);
    return m[y][x] !== 1;
  }
}

function move(dx, dy) {
  if (state.dialogOpen || state.ending) return;
  const nx = state.x + dx, ny = state.y + dy;
  if (canWalk(nx, ny)) {
    state.x = nx; state.y = ny;
    checkTile();
  }
}

function checkTile() {
  if (state.scene === 'outside') {
    const t = city[state.y][state.x];
    if (t === 2) {
      // door
      const doors = {
        '6,7': 'home', '14,7': 'cram', '21,7': 'supermarket',
        '29,7': 'school', '30,25': 'company', '37,7': 'police'
      };
      const key = state.x + ',' + state.y;
      const which = doors[key];
      if (which) askEnter(which);
    }
    if (t === 3 && state.x >= 35 && state.x <= 38 && state.y >= 9 && state.y <= 12) {
      if (!state.talkedTo.park) {
        state.talkedTo.park = true;
        openDialog('Park', 'You sit on a bench. Nobody is here. You think about nothing for a while.', [
          { text: 'Okay.', action: closeDialog }
        ]);
      }
    }
  } else {
    const r = indoors[state.scene];
    const m = buildIndoor(state.scene);
    if (m[state.y][state.x] === 2) {
      // exit
      exitToOutside();
    }
  }
}

function askEnter(which) {
  if (which === 'home') {
    openDialog('Home', 'Go inside?', [
      { text: 'Yes.', action: () => enterIndoor('home') },
      { text: 'Not now.', action: closeDialog }
    ]);
  } else if (which === 'school') {
    if (state.flags.droppedOut) {
      openDialog('School', 'The door is locked. You don\'t go here anymore.', [
        { text: 'Leave.', action: closeDialog }
      ]);
    } else {
      openDialog('School', 'Go inside?', [
        { text: 'Yes.', action: () => enterIndoor('school') },
        { text: 'Not now.', action: closeDialog }
      ]);
    }
  } else if (which === 'company') {
    if (state.age < 18) {
      openDialog('Company', 'You are too young to work here.', [
        { text: 'Leave.', action: closeDialog }
      ]);
    } else {
      openDialog('Company', 'Go inside?', [
        { text: 'Yes.', action: () => enterIndoor('company') },
        { text: 'Not now.', action: closeDialog }
      ]);
    }
  } else if (which === 'cram') {
    openDialog('Cram School', 'Your parents signed you up. You go in.', [
      { text: 'Okay.', action: closeDialog }
    ]);
  } else if (which === 'supermarket') {
    openDialog('Supermarket', 'You buy nothing. You just walk around.', [
      { text: 'Okay.', action: closeDialog }
    ]);
  } else if (which === 'police') {
    openDialog('Police Station', 'You have no reason to be here.', [
      { text: 'Leave.', action: closeDialog }
    ]);
  }
}

function enterIndoor(name) {
  closeDialog();
  state.scene = name;
  const r = indoors[name];
  state.x = r.exit.x;
  state.y = r.exit.y - 2;
}

function exitToOutside() {
  state.scene = 'outside';
  // put player just below the door they came out of
  // simple: put back near home
  state.x = 6;
  state.y = 9;
}

/* ---------- talk ---------- */
function tryTalk() {
  if (state.dialogOpen || state.ending) return;

  if (state.scene === 'outside') {
    const n = outsideNPCs.find(n =>
      Math.abs(n.x - state.x) <= 1 && Math.abs(n.y - state.y) <= 1);
    if (n) {
      if (n.id === 'neighbor') {
        openDialog('Neighbor', 'Your parents must be proud. You study so much.', [
          { text: 'Thank you.', action: closeDialog }
        ]);
      } else if (n.id === 'friend') {
        openDialog('Friend', 'You wanna hang out?', [
          { text: 'Yes.', action: () => { state.flags.skippedStudy = true; closeDialog(); } },
          { text: "I can't. My parents.", action: closeDialog }
        ]);
      } else if (n.id === 'stranger') {
        openDialog('Stranger', 'Nice day.', [
          { text: 'Yeah.', action: closeDialog }
        ]);
      }
    }
  } else {
    const r = indoors[state.scene];
    const n = r.npcs.find(n =>
      Math.abs(n.x - state.x) <= 1 && Math.abs(n.y - state.y) <= 1);
    if (!n) return;

    if (state.scene === 'school' && state.flags.droppedOut) return;

    if (n.id === 'mom') {
      openDialog('Mom', 'Did you eat? Are you studying? Why are you not studying?', [
        { text: 'I am.', action: closeDialog },
        { text: "I'm tired.", action: closeDialog }
      ]);
    } else if (n.id === 'dad') {
      openDialog('Dad', 'When I was your age, I had nothing. You have everything. Why aren\'t you better?', [
        { text: "I don't know.", action: closeDialog },
        { text: "I'm trying.", action: closeDialog }
      ]);
    } else if (n.id === 'teacher') {
      openDialog('Teacher', 'You are quiet in class. Is everything okay?', [
        { text: 'Yes.', action: closeDialog },
        { text: 'No.', action: closeDialog }
      ]);
    } else if (n.id === 'classmate') {
      openDialog('Classmate', 'What are you doing this weekend?', [
        { text: 'Studying.', action: closeDialog },
        { text: 'Nothing.', action: closeDialog }
      ]);
    } else if (n.id === 'hr') {
      if (!state.flags.hasJob) {
        openDialog('HR', 'We are hiring. Do you want to apply?', [
          { text: 'Yes.', action: () => {
            state.flags.hasJob = true;
            state.money += 2000;
            state.age += 1;
            updateHUD();
            closeDialog();
          }},
          { text: 'No.', action: closeDialog }
        ]);
      } else {
        openDialog('HR', 'You already work here.', [
          { text: 'Okay.', action: closeDialog }
        ]);
      }
    } else if (n.id === 'boss') {
      openDialog('Boss', 'Keep it up. We notice people who work hard.', [
        { text: 'Thank you.', action: closeDialog }
      ]);
    }
  }
}

/* ---------- sleep ---------- */
function sleep() {
  state.age += 1;
  state.money += 10; // allowance
  updateHUD();
  closeDialog();

  if (state.age >= 32) {
    triggerEnding();
  }
}

/* ---------- dialog ---------- */
function openDialog(name, text, choices) {
  state.dialogOpen = true;
  document.getElementById('dName').textContent = name;
  document.getElementById('dText').textContent = text;
  const box = document.getElementById('dChoices');
  box.innerHTML = '';
  choices.forEach(c => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = c.text;
    b.onclick = c.action;
    box.appendChild(b);
  });
  document.getElementById('dialog').style.display = 'block';
}

function closeDialog() {
  state.dialogOpen = false;
  document.getElementById('dialog').style.display = 'none';
}

/* ---------- ending ---------- */
function triggerEnding() {
  state.ending = true;
  state.dialogOpen = true;
  document.getElementById('dName').textContent = '';
  document.getElementById('dText').textContent =
    "You are 32.\n\nYou still live in the same city.\n\nYou still don't know what you are doing.\n\nNobody asked if you grew up.";
  document.getElementById('dChoices').innerHTML = '';
  document.getElementById('dialog').style.display = 'block';
}

/* ---------- HUD ---------- */
function updateHUD() {
  document.getElementById('hud').textContent = 'Age: ' + state.age;
  document.getElementById('hudRight').textContent = '$' + state.money;
}

/* ---------- input ---------- */
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'arrowup') move(0, -1);
  else if (k === 's' || k === 'arrowdown') move(0, 1);
  else if (k === 'a' || k === 'arrowleft') move(-1, 0);
  else if (k === 'd' || k === 'arrowright') move(1, 0);
  else if (k === ' ') { e.preventDefault(); tryTalk(); }
});

/* ---------- loop ---------- */
function loop() {
  draw();
  requestAnimationFrame(loop);
}

updateHUD();
loop();
</script>
</body>
</html>
